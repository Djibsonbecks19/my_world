<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Signal Lost</title>
<style>
  :root { --accent:#c9a96e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#060606; color:#f0ece4; font-family:'Courier New',monospace; min-height:100vh; display:grid; place-items:center; overflow:hidden; text-align:center; padding:24px; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.25) 50%); background-size:100% 4px; opacity:.35; }
  .glitch { font-size:clamp(80px,22vw,190px); font-weight:700; letter-spacing:.05em; position:relative; color:var(--accent); text-shadow:0 0 30px rgba(201,169,110,.45); animation:flick 3s infinite; }
  .glitch::before, .glitch::after { content:attr(data-t); position:absolute; inset:0; }
  .glitch::before { color:#ff3355; transform:translate(-3px,0); clip-path:inset(0 0 55% 0); animation:slice 2.2s infinite steps(1); mix-blend-mode:screen; }
  .glitch::after  { color:#00e5ff; transform:translate(3px,0);  clip-path:inset(55% 0 0 0); animation:slice 1.7s infinite steps(1) reverse; mix-blend-mode:screen; }
  h1 { font-size:14px; letter-spacing:.4em; color:#00ff66; margin:6px 0 22px; }
  #log { color:rgba(240,236,228,.55); font-size:12px; line-height:2; min-height:100px; }
  a.btn { display:inline-block; margin-top:26px; background:var(--accent); color:#100c08; text-decoration:none; font-family:inherit; font-weight:700; font-size:12px; letter-spacing:.08em; padding:12px 26px; border-radius:999px; box-shadow:0 6px 22px rgba(201,169,110,.4); transition:transform .2s; }
  a.btn:hover { transform:translateY(-2px) scale(1.03); }
  @keyframes flick { 0%,92%,100%{opacity:1} 93%{opacity:.6} 95%{opacity:1} 97%{opacity:.7} }
  @keyframes slice { 0%{clip-path:inset(0 0 80% 0)} 25%{clip-path:inset(40% 0 30% 0)} 50%{clip-path:inset(70% 0 5% 0)} 75%{clip-path:inset(10% 0 60% 0)} 100%{clip-path:inset(50% 0 20% 0)} }
</style>
</head>
<body>
<main>
  <div class="glitch" data-t="404">404</div>
  <h1>SIGNAL LOST</h1>
  <div id="log"></div>
  <a class="btn" href="/">RETURN TO HUB</a>
</main>
<script>
  var lines = ['> requesting page... failed', '> this sector does not exist', '> rerouting to hub in <b id="n">10</b>s (press any key to go now)'];
  var log = document.getElementById('log'), i = 0;
  (function next() { if (i >= lines.length) return; var d = document.createElement('div'); d.innerHTML = lines[i++]; log.appendChild(d); setTimeout(next, 600); })();
  var n = 10, t = setInterval(function () { n--; var el = document.getElementById('n'); if (el) el.textContent = n; if (n <= 0) { clearInterval(t); location.href = '/'; } }, 1000);
  addEventListener('keydown', function () { location.href = '/'; });
</script>
</body>
</html>
